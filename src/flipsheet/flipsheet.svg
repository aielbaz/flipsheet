<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55c3f7"/>
      <stop offset="1" stop-color="#2579b8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eef5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b3a5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#tile)"/>

  <!-- the other side of the sheet, tilted behind -->
  <g transform="rotate(16 66 64)">
    <rect x="42" y="22" width="52" height="74" rx="6" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- front of the sheet, with a folded corner and text lines -->
  <g filter="url(#shadow)">
    <path d="M32 24h30l20 20v50a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6V30a6 6 0 0 1 6-6z" fill="url(#paper)"/>
  </g>
  <path d="M62 24v14a6 6 0 0 0 6 6h14z" fill="#c4d6e4"/>
  <g fill="#8fa9bd">
    <rect x="34" y="54" width="38" height="5" rx="2.5"/>
    <rect x="34" y="66" width="30" height="5" rx="2.5"/>
    <rect x="34" y="78" width="36" height="5" rx="2.5"/>
  </g>

  <!-- flip arrow: sweeps from under the sheet round to its other side -->
  <path d="M63 105.5A40 40 0 0 0 104.6 46" fill="none" stroke="#ffb02e" stroke-width="9" stroke-linecap="round"/>
  <path d="M96.6 32.1 114.1 40.5 95.1 51.5z" fill="#ffb02e" stroke="#ffb02e" stroke-width="4" stroke-linejoin="round"/>
</svg>
