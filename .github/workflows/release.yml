name: Build RPM

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]   # only merged PRs are built; see the `if` on the rpm job

jobs:
  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build pyproject-rpm-macros python3-devel desktop-file-utils \
            python3-PyMuPDF python3-pyside6 git tar gzip

      - uses: actions/checkout@v4
        with:
          # for a merged PR, build exactly what was merged
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Build the RPM
        run: packaging/build-rpm.sh

      - name: Collect packages
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.src.rpm dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: dist/*.rpm

  release:
    name: Publish release
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
          generate_release_notes: true
