name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:      # build and attach RPMs to an existing release: gh workflow run release.yml -f tag=flipsheet-v1.0.0
    inputs:
      tag:
        description: Existing release tag to build the RPMs for
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4

  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build pyproject-rpm-macros python3-devel python3-setuptools \
            desktop-file-utils python3-PyMuPDF python3-pyside6 git tar gzip

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Build the RPM
        run: packaging/build-rpm.sh

      - name: Collect packages
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.src.rpm dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: dist/*.rpm

  upload:
    name: Attach RPMs to the release
    needs: [release-please, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name || inputs.tag }}" dist/*.rpm --clobber --repo "${{ github.repository }}"
